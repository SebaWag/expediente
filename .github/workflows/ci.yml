name: CI

# Two jobs, because the repository makes two different promises:
#
#  1. the deterministic core needs nothing but Python — a clone and a pytest;
#  2. the graph adapter is only true if it is checked against the real engine,
#     so the second job starts MillenniumDB and runs the same suite with
#     EXPEDIENTE_MDB_URL set. Without it, seven tests skip and the claim
#     "the engine and the in-memory adapter agree" is never tested.
#
# The quickstart is run as-is, from the README, so documentation drift fails
# the build instead of being discovered by a reader.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core:
    name: core · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,pdf]"

      - name: Unit tests (no graph, no network)
        run: python -m pytest -q

      - name: Quickstart, exactly as the README states it
        run: |
          set -euo pipefail
          python -m expediente.cli detect --input examples/oc_synthetic.json --ceiling 1000000
          python -m expediente.cli gate   --input examples/dossier_synthetic.json
          python -m expediente.cli dossier --input examples/dossier_synthetic.json \
                  --out out/caso.md --generado 2026-10-27
          python -m expediente.cli investigate --key 11111111-1 \
                  --out out/investigacion.md --generado 2026-10-27
          test -s out/caso.md
          test -s out/investigacion.md

  graph:
    name: graph · MillenniumDB
    runs-on: ubuntu-latest
    needs: core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,pdf]"

      - name: Start an isolated MillenniumDB
        run: bash scripts/mdb_isolated.sh start

      - name: Full suite against the real engine
        env:
          EXPEDIENTE_MDB_URL: http://127.0.0.1:1234
        run: python -m pytest -q

      - name: Engine log, if anything failed
        if: failure()
        run: bash scripts/mdb_isolated.sh logs || true

      - name: Stop the engine
        if: always()
        run: bash scripts/mdb_isolated.sh stop || true
