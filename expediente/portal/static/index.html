<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expediente · auditoría de compras públicas de Chile</title>
<meta name="description" content="Pregunta en tus palabras y el grafo de compras públicas de Chile se mueve hasta la respuesta. Cada afirmación viene con su documento.">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<canvas id="mapa" aria-label="Grafo de compras públicas" role="img"></canvas>

<header class="barra-superior">
  <div class="marca">
    <span class="logo" aria-hidden="true">◧</span>
    <div>
      <h1>Expediente</h1>
      <p>Herramienta de auditoría de datos públicos · Chile</p>
    </div>
  </div>

  <div class="cifras" aria-live="polite">
    <div><b id="n-ordenes">—</b><span>órdenes</span></div>
    <div><b id="n-proveedores">—</b><span>proveedores</span></div>
    <div><b id="n-organismos">—</b><span>organismos</span></div>
    <div><b id="n-documentos">—</b><span>documentos</span></div>
  </div>

  <nav class="acciones-mapa" aria-label="Controles del grafo">
    <button type="button" id="btn-capas" class="icono" title="Mostrar u ocultar tipos de nodo" aria-expanded="false">◍</button>
    <button type="button" data-mapa="in" class="icono" title="Acercar">+</button>
    <button type="button" data-mapa="out" class="icono" title="Alejar">−</button>
    <button type="button" data-mapa="reset" class="icono" title="Volver a la vista completa">⌂</button>
    <button type="button" id="btn-registro" class="icono" title="Registro de lo que hizo el agente">▤</button>
  </nav>
</header>

<div id="capas" class="capas" hidden></div>

<section class="chat" aria-label="Pregunta al sistema">
  <div class="transcripcion" id="transcripcion" aria-live="polite"></div>
  <form id="form-chat" class="compositor" autocomplete="off">
    <textarea id="pregunta" rows="1" placeholder="Escribe un organismo, una empresa o una pregunta…" aria-label="Tu mensaje"></textarea>
    <button type="submit" id="btn-enviar" title="Enviar">↑</button>
  </form>
  <div class="sugerencias" id="sugerencias">
    <button type="button" class="chip">Municipalidad de Santiago</button>
    <button type="button" class="chip">Cardiotec</button>
    <button type="button" class="chip">¿Por qué aparecen juntas las dos Cardiotec?</button>
    <button type="button" class="chip">¿Qué patrones hay de fraccionamiento?</button>
  </div>
</section>

<aside class="tarjeta" id="tarjeta" hidden aria-label="Detalle del nodo">
  <button class="cerrar" id="cerrar-tarjeta" aria-label="Cerrar">×</button>
  <div id="tarjeta-cuerpo"></div>
</aside>

<aside class="registro" id="registro" hidden aria-label="Registro del agente">
  <header>
    <h2>Registro</h2>
    <button class="cerrar" id="cerrar-registro" aria-label="Cerrar">×</button>
  </header>
  <label class="filtro">Investigación
    <select id="selector-run"></select>
  </label>
  <label class="check"><input type="checkbox" id="solo-importantes" checked> Solo pasos importantes</label>
  <ol class="eventos" id="eventos"></ol>
</aside>

<p class="letra-chica" id="letra-chica"></p>

<script src="/static/graph.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
